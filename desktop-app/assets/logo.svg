<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Minimalist White & Black Logo for ChronoLogic -->
  
  <!-- Background: Bold Solid White Circle -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" />
  
  <!-- Outer Ring: Clean Black Stroke (Represents Continuity/Time) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" />

  <!-- Inner Logic Element: Geometric Hands (Circuit Style) -->
  <!-- Hour Hand: Vertical, straight, rounded cap -->
  <rect x="248" y="100" width="16" height="156" rx="8" fill="#000000" />
  
  <!-- Minute Hand: Horizontal, breaking the circle -->
  <rect x="256" y="248" width="140" height="16" rx="8" fill="#000000" />

  <!-- Center Pivot: Black node with White stroke for separation -->
  <circle cx="256" cy="256" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6" />

  <!-- Logic Node Detail: A small connection point on the minute hand -->
  <circle cx="396" cy="256" r="12" fill="#000000" />
  
  <!-- Subtle minimalist ticks for 12, 3, 6, 9 -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round">
      <line x1="256" y1="70" x2="256" y2="85" />
      <line x1="442" y1="256" x2="427" y2="256" />
      <line x1="256" y1="442" x2="256" y2="427" />
      <line x1="70" y1="256" x2="85" y2="256" />
  </g>

</svg>
